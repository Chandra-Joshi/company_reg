services:
  backend:
    build: ./backend
    container_name: company_reg_container
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:12345@db:5432/company_incorporation
      PORT: 5000
    restart: always

  db:
    image: postgres:15
    container_name: company_db_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: company_incorporation
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"


volumes:
  pgdata: